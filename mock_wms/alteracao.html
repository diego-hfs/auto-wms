<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>WMS Demo — Alteração de Unidade</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#1f2937;overflow:hidden}header{height:76px;background:#172033;color:#fff;padding:18px 36px;display:flex;align-items:center;justify-content:space-between}header h1{margin:0;font-size:24px}.badge{background:#7c3aed;padding:8px 14px;border-radius:999px;font-size:13px}.panel{position:absolute;left:40px;top:95px;width:1200px;height:440px;background:#fff;border-radius:16px;box-shadow:0 8px 25px rgba(0,0,0,.10)}.title{position:absolute;left:38px;top:24px;font-weight:700;font-size:20px}label{position:absolute;font-size:13px;font-weight:700;color:#475569}input{position:absolute;height:42px;border:1px solid #94a3b8;border-radius:8px;padding:8px 12px;font-size:16px}#item-label{left:120px;top:85px}#item{left:120px;top:105px;width:360px}#pesquisar{position:absolute;left:680px;top:105px;width:180px;height:42px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}#um-label{left:120px;top:235px}#unidade_medida{left:120px;top:255px;width:360px}#sku-label{left:660px;top:235px}#unidade_medida_sku{left:660px;top:255px;width:360px}#salvar{position:absolute;left:850px;top:365px;width:180px;height:44px;border:0;border-radius:9px;background:#16a34a;color:#fff;font-weight:700;cursor:pointer}#status{position:absolute;left:40px;top:555px;width:1200px;height:42px;border-radius:10px;padding:11px 16px;background:#ede9fe;color:#6d28d9;font-weight:700}.history{position:absolute;left:40px;top:615px;width:1200px;height:255px;background:#fff;border-radius:14px;padding:14px 18px;overflow:hidden}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #e2e8f0;padding:7px 8px;text-align:left}th{background:#f8fafc}
</style>
</head>
<body>
<header><h1>WMS Demo — Alteração de Unidade de Medida</h1><div class="badge">SIMULAÇÃO LOCAL • DADOS FICTÍCIOS</div></header>
<section class="panel">
<div class="title">Manutenção de produto</div>
<label id="item-label">Pesquisar item</label><input id="item" autocomplete="off"><button id="pesquisar">Pesquisar</button>
<label id="um-label">Nova unidade de medida</label><input id="unidade_medida" autocomplete="off">
<label id="sku-label">Nova unidade de medida do SKU</label><input id="unidade_medida_sku" autocomplete="off">
<button id="salvar">Salvar alteração</button>
</section>
<div id="status">Aguardando automação...</div>
<section class="history"><table><thead><tr><th>#</th><th>Item</th><th>Nova UM</th><th>Nova UM SKU</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></section>
<script>
let count=0;document.getElementById("pesquisar").addEventListener("click",()=>{const item=document.getElementById("item").value;document.getElementById("status").textContent=`Item ${item} localizado na base fictícia.`});document.getElementById("salvar").addEventListener("click",()=>{const item=document.getElementById("item").value;const um=document.getElementById("unidade_medida").value;const sku=document.getElementById("unidade_medida_sku").value;count+=1;const tr=document.createElement("tr");tr.innerHTML=`<td>${count}</td><td>${item}</td><td>${um}</td><td>${sku}</td><td>Alteração simulada</td>`;document.getElementById("tbody").prepend(tr);document.getElementById("status").textContent=`Alteração do item ${item} salva. Total: ${count}`;["item","unidade_medida","unidade_medida_sku"].forEach(id=>document.getElementById(id).value="")});
</script>
</body>
</html>
